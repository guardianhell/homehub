# =============================================================================
# HomeHub Production Nginx Configuration
# Reverse Proxy for SPA Frontends & Internal API Gateway
# =============================================================================

upstream gateway_backend {
    server api-gateway:8000;
}

# -----------------------------------------------------------------------------
# 1. HomeHub Web Application (Port 80)
# -----------------------------------------------------------------------------
server {
    listen 80;
    server_name _;

    client_max_body_size 25M;

    # Reverse proxy API requests to API Gateway
    location /api/v1/ {
        proxy_pass http://gateway_backend/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90s;
    }

    # Static Frontend Web App (Single Page Application)
    location / {
        root /usr/share/nginx/html/web;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|woff2?|eot|ttf|otf|png|jpg|jpeg|gif|svg|ico)$ {
        root /usr/share/nginx/html/web;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}

# -----------------------------------------------------------------------------
# 2. HomeHub Admin Backoffice Portal (Port 8080)
# -----------------------------------------------------------------------------
